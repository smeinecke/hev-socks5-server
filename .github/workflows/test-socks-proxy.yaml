name: Test SOCKS Proxy

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-socks-proxy:
    name: Test SOCKS4/5 Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make curl

      - name: Build server
        run: |
          make
          sudo make install

      - name: Create test configuration
        run: |
          mkdir -p ~/.config/hev-socks5-server
          cat > ~/.config/hev-socks5-server/main.yml << 'EOL'
          main:
            workers: 2
            port: 1080
            listen-address:
              - '127.0.0.1'
              - '::1'
            udp-port: 0  # Disable UDP for testing
            listen-ipv6-only: false
            bind-address: ''
            bind-address-v4: ''
            bind-address-v6: ''
            bind-interface: ''
            domain-address-type: unspec

          misc:
            log-level: debug
          EOL

      - name: Start SOCKS server in background
        run: |
          hev-socks5-server ~/.config/hev-socks5-server/main.yml &
          echo $! > server.pid
          # Wait for server to start
          sleep 2

          # Test SOCKS5 on IPv4 listener
          curl -v --socks5 127.0.0.1:1080 https://ifconfig.me/ip
          # Test SOCKS5 hostname resolution on IPv4 listener
          curl -v --socks5-hostname 127.0.0.1:1080 https://ifconfig.me/ip
          # Test SOCKS5 on IPv6 listener
          curl -v --socks5 [::1]:1080 https://ifconfig.me/ip
          # Test SOCKS5 hostname resolution on IPv6 listener
          curl -v --socks5-hostname [::1]:1080 https://ifconfig.me/ip

          # Test SOCKS4 on IPv4 listener
          curl -v --socks4 127.0.0.1:1080 https://ifconfig.me/ip

          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi

      - name: Test error logging binary strings
        run: |
          # Run local test script to validate improved error strings in binary
          chmod +x test-logging.sh
          ./test-logging.sh

      - name: Test error logging includes host:port
        run: |
          # Start server with logging to file
          hev-socks5-server ~/.config/hev-socks5-server/main.yml 2>&1 | tee server.log &
          echo $! > server.pid
          sleep 2

          # Try to connect to localhost:1 which has no listener (will get connection refused)
          # This should trigger a connection failure that gets logged
          curl -v --socks5 127.0.0.1:1080 http://127.0.0.1:1/ 2>&1 || true

          sleep 1

          # Validate that error messages include the target address
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi

          # Check for improved error log format - should include "fail:" and "to [" with host:port
          if grep -E "fail:.*to \[" server.log; then
            echo "✓ Error messages include human-readable error and target address"
          else
            echo "✗ Error messages do not include expected format (fail: <error> to [<host>]:<port>)"
            cat server.log
            exit 1
          fi

          # Validate that numeric error codes are not used in error messages
          if grep -E "fail [0-9]+" server.log | grep -v "fail:"; then
            echo "✗ Found legacy numeric error codes (fail N instead of fail: description)"
            exit 1
          else
            echo "✓ No legacy numeric error codes found"
          fi

          # Check for specific error descriptions
          if grep -E "fail: (host unreachable|general failure|address type not supported)" server.log; then
            echo "✓ Error messages use human-readable descriptions"
          fi
